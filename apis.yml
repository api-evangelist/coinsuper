name: Coinsuper
description: 'Coinsuper presents itself as a cryptocurrency exchange offering USD-compliant
  crypto trading, spot markets, an exchange and trade interface, a token listing application
  process, a referral program, and blockchain products (LENS and Blockchain+). The
  public site markets white-label trading-system solutions, enterprise cold and hot
  wallet asset management, and industrial blockchain technical services, citing patents
  in crypto trading and blockchain core technology. Coinsuper was originally a Hong
  Kong exchange surfaced as a portfolio company of pantera-capital and added to the
  API Evangelist network for enrichment; the current site is a WordPress-hosted brand
  presence with no publicly documented developer API, SDKs, or developer portal at
  the time of this pass.'
